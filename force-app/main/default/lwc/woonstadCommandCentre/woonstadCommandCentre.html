<template>
    <div class="woonstad-command-centre-container">
        <!-- Tile: Zoek naar klanten -->
        <div class="woonstad-tile woonstad-tile-blue" onclick={handleTileClick} data-target="zoekKlanten">
            <div class="woonstad-tile-content">
                <lightning-icon icon-name="utility:search" size="large" class="woonstad-tile-icon"></lightning-icon>
                <span class="woonstad-tile-label">Zoek naar klanten</span>
            </div>
        </div>

        <!-- Tile: Aanvraag -->
        <div class="woonstad-tile woonstad-tile-lightblue" onclick={handleTileClick} data-target="aanvraag">
            <div class="woonstad-tile-content">
                <lightning-icon icon-name="utility:form" size="large" class="woonstad-tile-icon"></lightning-icon>
                <span class="woonstad-tile-label">Ik heb een aanvraag</span>
            </div>
        </div>

        <!-- Tile: Vraag -->
        <div class="woonstad-tile woonstad-tile-lightgreen" onclick={handleTileClick} data-target="vraag">
            <div class="woonstad-tile-content">
                <lightning-icon icon-name="utility:question" size="large" class="woonstad-tile-icon"></lightning-icon>
                <span class="woonstad-tile-label">Ik heb een vraag</span>
            </div>
        </div>
    </div>

 <!-- Modal: Zoek naar klanten -->
<template if:true={showCustomerSearchModal}>
    <c-woonstad-customer-search 
        oncreatenew={handleCreateNew} 
        onclose={closeCustomerSearchModal}
        onshowoverview={handleShowCustomerOverview}>
    </c-woonstad-customer-search>
</template>

<!-- Modal: Nieuwe klant aanmaken wizard -->
<template if:true={showCreateCustomerWizardModal}>
    <c-woonstad-create-customer-wizard 
        onclose={closeCreateCustomerWizardModal}
        onback={handleBackToCustomerSearch}>
    </c-woonstad-create-customer-wizard>
</template>

<!-- Modal: Klantoverzicht -->
<template if:true={showCustomerOverviewModal}>
    <c-woonstad-customer-overview 
        record-id={selectedAccountId}
        onclose={closeCustomerOverviewModal}>
    </c-woonstad-customer-overview>
</template>
</template>
